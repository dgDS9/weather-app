name: CI

  on: 
    pull_request:
      branches:
        - main
  
    push:
      branches:
        - main

permissions:
  contents: read 

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# env:
#   IMAGE_NAME: hier muss das regestierte Image rein 
  
jobs: 
  Backend-Checks:
    name: Backend Checks  
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall .
        # run: |
        #   pip install flake8
        #   flake8 --max-line-length=120 --ignore=E203,E501,W503 . 

      - name: run test
        run: |
          pip install pytest
          python -m pytest -v


  model-quality-gate:
    name: Model Quality Gate
    runs-on: ubuntu-latest
    needs: backend-checks

    steps:
    - name: checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: check model quality
      run: python src/quality_gate.py



  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
    - backend-checks
    - model-quality-gate


    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: set up docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PR Docker image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push main Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

